services:
  # Backend NestJS API
  - type: web
    name: trace-api
    plan: free
    env: node
    buildCommand: npm install && npx prisma generate --schema=apps/api/prisma/schema.prisma && npx turbo run build --filter=backend
    # Push database schema, then start NestJS production build
    startCommand: cd apps/api && npx prisma db push --schema=prisma/schema.prisma --accept-data-loss && npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trace-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # These keys will need to be provided manually in the Render dashboard
      - key: X_API_KEY
        sync: false
      - key: X_API_SECRET
        sync: false
      - key: X_BEARER_TOKEN
        sync: false

  # Admin Web Dashboard
  - type: web
    name: trace-web
    env: static
    buildCommand: npm install && npx turbo run build --filter=web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: trace-api
          property: host

databases:
  - name: trace-db
    databaseName: trace_db
    user: trace_user
    plan: free
